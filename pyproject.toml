[project]
name = "eoflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
eoflow-update-config = "scripts.update_config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eoflow", "scripts"]

[dependency-groups]
dev = [
    "ipython>=8.12.0",
    "pytest>=8.0.0",
]
