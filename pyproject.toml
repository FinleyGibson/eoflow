[project]
name = "eoflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.0.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
    "geopandas>=1.1.1",
    "pytest>=9.0.1",
    "httpx>=0.28.1",
    "fastapi>=0.128.0",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "leaflet>=0.0.3",
    "leafmap>=0.57.9",
    "localtileserver>=0.10.6",
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "rasterio>=1.4.3",
    "setuptools>=80.9.0",
    "xarray>=2025.7.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.12.0",
    "pytest>=8.0.0",
    "jupyterlab>=4.4.3",
]

[project.scripts]
eoflow-update-config = "scripts.update_config:main"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.hatch.build.targets.wheel]
packages = ["src/eoflow", "scripts"]

[dependency-groups]
dev = [
    "geopandas>=1.1.1",
    "ipython>=8.12.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
where = ["src"]
