[project]
name = "eoflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
    "geopandas>=1.1.1",
    "pytest>=9.0.1",
    "httpx>=0.28.1",
    "fastapi>=0.128.0",
    "folium>=0.20.0",
    "fiona>=1.10.1",
    "leaflet>=0.0.3",
    "leafmap>=0.57.9",
    "localtileserver>=0.10.6",
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "rasterio>=1.4.3",
    "setuptools>=80.9.0",
    "shapely>=2.1.2",
    "pyproj>=3.6.0",
    "networkx>=3.6.1",
    "platformdirs>=4.3.8",
    "pysheds @ git+https://github.com/FinleyGibson/pysheds.git",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.12.0",
    "pytest>=8.0.0",
    "jupyterlab>=4.4.3",
]

[project.scripts]
eoflow-update-config = "scripts.update_config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eoflow", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests that call external APIs (deselect with '-m \"not integration\"')",
]


[tool.setuptools.packages.find]
where = ["src"]
